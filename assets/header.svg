<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Luis Sambrano — Full-stack builder, AI in the loop">
  <defs>
    <style>
      .name {
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 50px;
        letter-spacing: 0.5px;
      }
      .tag {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        font-weight: 400;
        font-size: 15px;
        letter-spacing: 6px;
      }
      .name { fill: #111827; }
      .tag  { fill: #6b7280; }
      .rule { stroke: #d1d5db; stroke-width: 1.25; }
      @media (prefers-color-scheme: dark) {
        .name { fill: #f4f4f5; }
        .tag  { fill: #a1a1aa; }
        .rule { stroke: #3f3f46; }
      }
    </style>
  </defs>
  <g text-anchor="middle">
    <text class="name" x="400" y="72">Luis Sambrano</text>
    <line class="rule" x1="280" y1="100" x2="520" y2="100"/>
    <text class="tag" x="403" y="130">FULL-STACK&#160;BUILDER&#160;&#183;&#160;AI&#160;IN&#160;THE&#160;LOOP</text>
  </g>
</svg>
